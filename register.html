<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <div class="school-logo">SP</div>

      <p class="school-name">SCHOOL PORTAL</p>
      <h1>Create an account</h1>
      <p class="description">Enter your information to get started.</p>

      <form action="login.html" method="get">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input
            type="text"
            id="fullname"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          />
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            placeholder="Choose a username"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Create a password"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            placeholder="Enter your password again"
            autocomplete="new-password"
            required
          />
        </div>

        <!-- Anchor styled as a button, as required by the activity. -->
        <a href="login.html" class="register-button">Register</a>
      </form>

      <p class="account-link">
        Already have an account?
        <a href="login.html">Login here</a>
      </p>
    </main>
  </body>
</html>
